name: fetch hk_daily

on:
  schedule:
    # UTC 10:10 ≈ 北京/香港 18:10，适合港股收盘后日频刷新
    - cron: "10 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jd-data-fetch-hk-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q tushare pandas

      - name: Run hk_daily fetch script
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scripts/fetch_hk_daily.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "refresh hk_daily data"
            git push
          else
            echo "No changes to commit."
          fi
