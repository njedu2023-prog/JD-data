name: fetch alibaba_daily

on:
  workflow_dispatch:
  schedule:
    - cron: "20 11 * * 1-5"

permissions:
  contents: write

jobs:
  fetch-alibaba-daily:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas tushare

      - name: Run fetch_alibaba_daily.py
        run: python scripts/fetch_alibaba_daily.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data_raw/9988.HK/hk_daily_raw.csv \
            data_clean/9988.HK/daily_clean.csv \
            refresh_log/refresh_log.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "refresh 9988.HK raw clean"
            git push
          fi
