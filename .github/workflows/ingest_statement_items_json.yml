name: Ingest Statement Items JSON

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Fiscal year to ingest, e.g. 2025 / 2024 / 2023 / 2022 / 2021"
        required: true
        default: "2025"

permissions:
  contents: write

jobs:
  ingest-statement-items:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve target paths
        run: |
          YEAR="${{ github.event.inputs.year }}"
          JSON_PATH="data_fundamental/02618.HK/temp_statement_items_${YEAR}_fy.json"
          CSV_PATH="data_fundamental/02618.HK/fundamental_statement_items.csv"

          echo "YEAR=${YEAR}" >> $GITHUB_ENV
          echo "JSON_PATH=${JSON_PATH}" >> $GITHUB_ENV
          echo "CSV_PATH=${CSV_PATH}" >> $GITHUB_ENV

      - name: Show repo status before ingest
        run: |
          echo "PWD=$(pwd)"
          echo "YEAR=${YEAR}"
          echo "JSON_PATH=${JSON_PATH}"
          echo "CSV_PATH=${CSV_PATH}"
          ls -la
          ls -la data_fundamental/02618.HK || true
          test -f "${JSON_PATH}"
          test -f "${CSV_PATH}"

      - name: Run ingest_statement_items_json.py
        run: |
          python scripts/ingest_statement_items_json.py \
            --json "${JSON_PATH}" \
            --csv "${CSV_PATH}"

      - name: Show head of output csv
        run: |
          echo "----- fundamental_statement_items.csv (head) -----"
          python - <<'PY'
          from pathlib import Path

          p = Path("data_fundamental/02618.HK/fundamental_statement_items.csv")
          if not p.exists():
              raise SystemExit("fundamental_statement_items.csv not found after ingest")

          lines = p.read_text(encoding="utf-8-sig").splitlines()
          for line in lines[:20]:
              print(line)
          print(f"TOTAL_LINES={len(lines)}")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data_fundamental/02618.HK/fundamental_statement_items.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ingest statement items json for 02618.HK ${YEAR}"
            git push
          fi
