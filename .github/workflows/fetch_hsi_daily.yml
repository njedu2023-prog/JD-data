name: fetch hsi_daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"

concurrency:
  group: jd-data-fetch-hsi-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TZ: Asia/Shanghai
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas tushare

      - name: Run hsi daily fetch script
        run: |
          python scripts/fetch_hsi_daily.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data_raw/HSI/hsi_raw.csv data_clean/HSI/hsi_clean.csv refresh_log/refresh_log.csv || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "refresh hsi_daily data"
          git push
