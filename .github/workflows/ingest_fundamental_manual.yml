name: ingest_fundamental_manual

on:
  workflow_dispatch:
    inputs:
      input_json:
        description: "待导入 JSON 路径（相对仓库根目录）"
        required: true
        default: "data_fundamental/02618.HK/staging/temp_fundamental_records_2025.json"
      operator:
        description: "本次导入操作者标识"
        required: true
        default: "github-actions"
      dry_run:
        description: "是否仅预演不落库（true/false）"
        required: true
        default: "false"

permissions:
  contents: write

concurrency:
  group: ingest-fundamental-manual
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      FUNDAMENTAL_CSV: data_fundamental/02618.HK/fundamental_quarterly.csv
      INGEST_LOG: data_fundamental/02618.HK/ingest_log.csv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required files exist
        shell: bash
        run: |
          set -euo pipefail

          echo "input_json=${{ github.event.inputs.input_json }}"
          echo "operator=${{ github.event.inputs.operator }}"
          echo "dry_run=${{ github.event.inputs.dry_run }}"

          test -f "scripts/ingest_fundamental_stub.py"
          test -f "scripts/validate_fundamental_table.py"
          test -f "${FUNDAMENTAL_CSV}"
          test -f "${INGEST_LOG}"
          test -f "${{ github.event.inputs.input_json }}"

      - name: Show input preview
        shell: bash
        run: |
          set -euo pipefail
          echo "===== INPUT FILE PREVIEW BEGIN ====="
          sed -n '1,220p' "${{ github.event.inputs.input_json }}"
          echo "===== INPUT FILE PREVIEW END ====="

      - name: Validate baseline table before ingest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_fundamental_table.py --file "${FUNDAMENTAL_CSV}"

      - name: Dry run ingest
        if: ${{ github.event.inputs.dry_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ingest_fundamental_stub.py \
            --input "${{ github.event.inputs.input_json }}" \
            --operator "${{ github.event.inputs.operator }}" \
            --dry-run

      - name: Execute ingest
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ingest_fundamental_stub.py \
            --input "${{ github.event.inputs.input_json }}" \
            --operator "${{ github.event.inputs.operator }}"

      - name: Validate table after ingest
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_fundamental_table.py --file "${FUNDAMENTAL_CSV}"

      - name: Show updated outputs
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FUNDAMENTAL TABLE HEAD ====="
          sed -n '1,20p' "${FUNDAMENTAL_CSV}" || true

          echo "===== FUNDAMENTAL TABLE TAIL ====="
          tail -n 20 "${FUNDAMENTAL_CSV}" || true

          echo "===== INGEST LOG TAIL ====="
          tail -n 20 "${INGEST_LOG}" || true

      - name: Commit and push changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${FUNDAMENTAL_CSV}"
          git add "${INGEST_LOG}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "ingest fundamental data from $(basename "${{ github.event.inputs.input_json }}")"
          git push
