name: refresh all and validate

on:
  workflow_dispatch:
    inputs:
      include_1519_in_gate:
        description: "是否将 1519.HK 纳入仓库级总闸门（1=纳入，0=不纳入）"
        required: false
        default: "0"
      run_1519_fetch:
        description: "是否执行 1519.HK 单线刷新（1=执行，0=跳过）"
        required: false
        default: "0"

concurrency:
  group: jd-data-refresh-all-and-validate
  cancel-in-progress: false

jobs:
  refresh_and_validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TZ: Asia/Shanghai
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      INCLUDE_1519_IN_GATE: ${{ github.event.inputs.include_1519_in_gate || '0' }}
      RUN_1519_FETCH: ${{ github.event.inputs.run_1519_fetch || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas tushare yfinance

      - name: Show gate mode
        run: |
          echo "TZ=$TZ"
          echo "INCLUDE_1519_IN_GATE=$INCLUDE_1519_IN_GATE"
          echo "RUN_1519_FETCH=$RUN_1519_FETCH"

      - name: Run hk daily fetch script
        run: |
          python scripts/fetch_hk_daily.py

      - name: Run jd group daily fetch script
        run: |
          python scripts/fetch_jd_group_daily.py

      - name: Run meituan daily fetch script
        run: |
          python scripts/fetch_meituan_daily.py

      - name: Run alibaba daily fetch script
        run: |
          python scripts/fetch_alibaba_daily.py

      - name: Run zto daily fetch script
        run: |
          python scripts/fetch_zto_daily.py

      - name: Run jtexpress daily fetch script
        if: env.RUN_1519_FETCH == '1'
        run: |
          python scripts/fetch_jtexpress_daily.py

      - name: Run hk calendar fetch script
        run: |
          python scripts/fetch_hk_calendar.py

      - name: Run hsi daily fetch script
        run: |
          python scripts/fetch_hsi_daily.py

      - name: Run hktech daily fetch script
        run: |
          python scripts/fetch_hktech_daily.py

      - name: Run hscei daily fetch script
        run: |
          python scripts/fetch_hscei_daily.py

      - name: Show git status before commit
        run: |
          echo "===== git status before add ====="
          git status -sb

      - name: Commit and push all refresh changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data_raw/02618.HK/hk_daily_raw.csv
          git add data_clean/02618.HK/daily_clean.csv
          git add jd-logistics-latest.json

          git add data_raw/9618.HK/hk_daily_raw.csv
          git add data_clean/9618.HK/daily_clean.csv

          git add data_raw/3690.HK/hk_daily_raw.csv
          git add data_clean/3690.HK/daily_clean.csv

          git add data_raw/9988.HK/hk_daily_raw.csv
          git add data_clean/9988.HK/daily_clean.csv

          git add data_raw/2057.HK/hk_daily_raw.csv
          git add data_clean/2057.HK/daily_clean.csv

          if [ "$RUN_1519_FETCH" = "1" ]; then
            git add data_raw/1519.HK/hk_daily_raw.csv
            git add data_clean/1519.HK/daily_clean.csv
          fi

          git add calendar/hk_trade_calendar.csv

          git add data_raw/HSI/hsi_raw.csv
          git add data_clean/HSI/hsi_clean.csv

          git add data_raw/HKTECH/hktech_raw.csv
          git add data_clean/HKTECH/hktech_clean.csv

          git add data_raw/HSCEI/hscei_raw.csv
          git add data_clean/HSCEI/hscei_clean.csv

          git add refresh_log/refresh_log.csv

          echo "===== git status after add ====="
          git status -sb

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "refresh all market data"
          git push

      - name: Run repository validation
        run: |
          python scripts/validate_repository.py
