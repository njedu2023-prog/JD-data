name: Generate walk-forward report v1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pandas scikit-learn
      - name: Generate report
        run: python scripts/generate_walk_forward_report_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: walk-forward-report
          path: reports/walk_forward_report_v1.md
      - uses: EndBug/add-and-commit@v9
        with:
          add: reports/walk_forward_report_v1.md
          message: "[walkforward] 报告 - 生成"
          author_name: github-actions
          author_email: actions@github.com
          committer_name: github-actions
          committer_email: actions@github.com
