name: Train baseline models v3

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Train baseline models v3
        run: python scripts/train_baseline_models_v3.py

      - name: Commit baseline report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data_model/02618.HK/baseline_model_v1.json
          git commit -m "[baseline] 训练 - success" || echo "No changes to commit"
          git push
