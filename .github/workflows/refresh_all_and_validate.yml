name: refresh all and validate

on:
  workflow_dispatch:

concurrency:
  group: jd-data-refresh-all-and-validate
  cancel-in-progress: false

jobs:
  refresh_and_validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TZ: Asia/Shanghai
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas tushare yfinance

      - name: Run hk daily fetch script
        run: |
          python scripts/fetch_hk_daily.py

      - name: Run jd group daily fetch script
        run: |
          python scripts/fetch_jd_group_daily.py

      - name: Run hk calendar fetch script
        run: |
          python scripts/fetch_hk_calendar.py

      - name: Run hsi daily fetch script
        run: |
          python scripts/fetch_hsi_daily.py

      - name: Run hktech daily fetch script
        run: |
          python scripts/fetch_hktech_daily.py

      - name: Run hscei daily fetch script
        run: |
          python scripts/fetch_hscei_daily.py

      - name: Show git status before commit
        run: |
          echo "===== git status before add ====="
          git status -sb

      - name: Commit and push all refresh changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data_raw/02618.HK/hk_daily_raw.csv
          git add data_clean/02618.HK/daily_clean.csv
          git add jd-logistics-latest.json

          git add data_raw/9618.HK/hk_daily_raw.csv
          git add data_clean/9618.HK/daily_clean.csv

          git add calendar/hk_trade_calendar.csv

          git add data_raw/HSI/hsi_raw.csv
          git add data_clean/HSI/hsi_clean.csv

          git add data_raw/HKTECH/hktech_raw.csv
          git add data_clean/HKTECH/hktech_clean.csv

          git add data_raw/HSCEI/hscei_raw.csv
          git add data_clean/HSCEI/hscei_clean.csv

          git add refresh_log/refresh_log.csv

          echo "===== git status after add ====="
          git status -sb

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "refresh all market data"
          git push

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run repository validation
        run: |
          python scripts/validate_repository.py
