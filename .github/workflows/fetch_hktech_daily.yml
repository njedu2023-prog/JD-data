name: fetch hktech_daily

on:
  workflow_dispatch:
  schedule:
    - cron: "40 19 * * *"

concurrency:
  group: jd-data-fetch-hktech-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TZ: Asia/Shanghai
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas tushare

      - name: Run hktech daily fetch script
        run: |
          python scripts/fetch_hktech_daily.py

      - name: Inspect generated files
        run: |
          echo "===== pwd ====="
          pwd

          echo "===== list repo root ====="
          ls -la

          echo "===== list data_raw ====="
          ls -la data_raw || true

          echo "===== list data_raw/HKTECH ====="
          ls -la data_raw/HKTECH || true

          echo "===== list data_clean ====="
          ls -la data_clean || true

          echo "===== list data_clean/HKTECH ====="
          ls -la data_clean/HKTECH || true

          echo "===== list refresh_log ====="
          ls -la refresh_log || true

          echo "===== preview refresh_log tail ====="
          tail -n 20 refresh_log/refresh_log.csv || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "===== git status before add ====="
          git status -sb

          git add data_raw/HKTECH/hktech_raw.csv
          git add data_clean/HKTECH/hktech_clean.csv
          git add refresh_log/refresh_log.csv

          echo "===== git status after add ====="
          git status -sb

          echo "===== staged diff summary ====="
          git diff --cached --stat || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "refresh hktech_daily data"
          git push
