name: Init Fundamental Consumer Tables

on:
  workflow_dispatch:

jobs:
  init-consumer-tables:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run init script
        run: |
          python scripts/init_fundamental_consumer_tables.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_fundamental/02618.HK/fundamental_statement_items.csv
          git add data_fundamental/02618.HK/fundamental_features.csv
          git commit -m "init fundamental consumer tables" || echo "No changes to commit"
          git push
