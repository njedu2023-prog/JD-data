name: Build Model Features

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "可选：起始日期，格式 YYYY-MM-DD"
        required: false
        default: ""
      end_date:
        description: "可选：结束日期，格式 YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-model-features
  cancel-in-progress: false

jobs:
  build-model-features:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Show inputs
        run: |
          echo "start_date=${{ github.event.inputs.start_date }}"
          echo "end_date=${{ github.event.inputs.end_date }}"

      - name: Run build_model_features.py
        shell: bash
        run: |
          set -euo pipefail

          CMD=(python scripts/build_model_features.py)

          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            CMD+=(--start-date "${{ github.event.inputs.start_date }}")
          fi

          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            CMD+=(--end-date "${{ github.event.inputs.end_date }}")
          fi

          echo "Running command: ${CMD[*]}"
          "${CMD[@]}"

      - name: Verify output exists
        run: |
          test -f data_model/02618.HK/model_features.csv
          echo "[OK] output exists: data_model/02618.HK/model_features.csv"
          wc -l data_model/02618.HK/model_features.csv || true

      - name: Commit and push output
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data_model/02618.HK/model_features.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "build model features for 02618.HK"
          git push
