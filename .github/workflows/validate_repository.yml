name: validate repository

on:
  workflow_dispatch:
    inputs:
      include_1519_in_gate:
        description: "是否将 1519.HK 纳入仓库级总闸门（1=纳入，0=不纳入）"
        required: false
        default: "0"
  push:
    branches:
      - main

concurrency:
  group: jd-data-validate-repository
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai
      INCLUDE_1519_IN_GATE: ${{ github.event.inputs.include_1519_in_gate || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Show gate mode
        run: |
          echo "TZ=$TZ"
          echo "INCLUDE_1519_IN_GATE=$INCLUDE_1519_IN_GATE"

      - name: Run repository validation
        run: |
          python scripts/validate_repository.py
