name: fetch hk_daily
on:
  schedule:
    - cron: "10 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q tushare pandas
      - env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scripts/fetch_hk_daily.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "add hk_daily workflow"
            git push
          fi
